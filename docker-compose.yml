# Starts the whole system: docker compose up -d --build
#   map      http://localhost:8000
#   Grafana  http://localhost:3000
x-python: &python
  restart: on-failure            # a service that starts before its tables exist just tries again
  environment:
    KAFKA: kafka:19092
    DB: postgresql://ranmon:ranmon@postgres:5432/ranmon

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: ranmon, POSTGRES_PASSWORD: ranmon, POSTGRES_DB: ranmon}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranmon"]
      interval: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [postgres]

  simulator:
    <<: *python
    build: {context: ., args: {SERVICE: simulator}}
    command: python simulator.py
    stop_signal: SIGINT          # so it clears its open alarms before stopping
    depends_on:
      kafka: {condition: service_healthy}

  collector:
    <<: *python
    build: {context: ., args: {SERVICE: collector}}
    command: python collector.py
    stop_signal: SIGINT
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  correlator:
    <<: *python
    build: {context: ., args: {SERVICE: correlator}}
    command: python correlator.py
    stop_signal: SIGINT
    depends_on: [collector]

  detector:
    <<: *python
    build: {context: ., args: {SERVICE: detector}}
    command: python detector.py
    stop_signal: SIGINT
    depends_on: [correlator]

  mapserver:
    <<: *python
    build: {context: ., args: {SERVICE: mapserver}}
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
